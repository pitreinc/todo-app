<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William's Todo</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: rgba(22, 27, 40, 0.85);
            --card-border: rgba(255, 255, 255, 0.06);
            --text: #e8eef7;
            --text-secondary: #8b9bb4;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.35);
            --danger: #f43f5e;
            --success: #10b981;
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 440px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #e8eef7 0%, #8b9bb4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--card);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .card h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.25);
            color: var(--text);
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 16px var(--primary-glow);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .switch-auth {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .switch-auth a {
            color: var(--primary);
            cursor: pointer;
            font-weight: 500;
            margin-left: 4px;
        }

        .error {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.25);
            color: #fb7185;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-row input {
            margin-bottom: 0;
        }

        .add-btn {
            padding: 0 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--primary-glow);
            transition: all 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-1px);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 2px;
        }

        #counter {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            opacity: 0.8;
        }

        .clear-btn:hover { opacity: 1; }

        ul { list-style: none; }

        li {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        li:hover {
            border-color: rgba(59, 130, 246, 0.3);
        }

        li.completed span {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        li span {
            flex: 1;
            font-size: 15px;
            word-break: break-word;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            color: var(--danger);
            background: rgba(244, 63, 94, 0.1);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>William's Todo</h1>
            <div class="header-actions">
                <button class="icon-btn" id="logoutBtn" onclick="logout()" title="Logout" style="display:none">⏻</button>
            </div>
        </header>

        <!-- AUTH -->
        <div id="authSection" class="card">
            <h2 id="authTitle">Welcome back</h2>
            <div class="error" id="authError"></div>

            <input type="email" id="email" placeholder="Email address" autocomplete="email">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">

            <button class="btn btn-primary" id="authBtn" onclick="handleAuth()">Sign in</button>

            <div class="switch-auth">
                <span id="switchText">New here?</span>
                <a id="switchLink" onclick="toggleAuthMode()">Create an account</a>
            </div>
        </div>

        <!-- TODOS -->
        <div id="todoSection" class="hidden">
            <div class="input-row">
                <input type="text" id="todoInput" placeholder="Add a new task...">
                <button class="add-btn" onclick="addTodo()">Add</button>
            </div>

            <div class="toolbar">
                <p id="counter">0 items left</p>
                <button class="clear-btn" onclick="clearCompleted()">Clear completed</button>
            </div>

            <ul id="todoList"></ul>
        </div>
    </div>

    <script>
        const API = "https://william-todo.onrender.com";
        let token = localStorage.getItem("token");
        let isLoginMode = true;

        function showError(msg) {
            const el = document.getElementById("authError");
            el.textContent = msg;
            el.style.display = "block";
        }

        function clearError() {
            document.getElementById("authError").style.display = "none";
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById("authTitle").textContent = isLoginMode ? "Welcome back" : "Create account";
            document.getElementById("authBtn").textContent = isLoginMode ? "Sign in" : "Create account";
            document.getElementById("switchText").textContent = isLoginMode ? "New here?" : "Already have an account?";
            document.getElementById("switchLink").textContent = isLoginMode ? "Create an account" : "Sign in";
            clearError();
        }

        async function handleAuth() {
            clearError();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                showError("Please fill in both fields");
                return;
            }

            const endpoint = isLoginMode ? "/login" : "/register";

            try {
                const res = await fetch(`${API}${endpoint}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.detail || "Something went wrong");
                    return;
                }

                token = data.access_token;
                localStorage.setItem("token", token);
                showTodoApp();
            } catch (err) {
                showError("Network error. Please try again.");
            }
        }

        function showTodoApp() {
            document.getElementById("authSection").classList.add("hidden");
            document.getElementById("todoSection").classList.remove("hidden");
            document.getElementById("logoutBtn").style.display = "flex";
            loadTodos();
        }

        function logout() {
            token = null;
            localStorage.removeItem("token");
            document.getElementById("authSection").classList.remove("hidden");
            document.getElementById("todoSection").classList.add("hidden");
            document.getElementById("logoutBtn").style.display = "none";
            document.getElementById("email").value = "";
            document.getElementById("password").value = "";
        }

        function getHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            };
        }

        async function loadTodos() {
            const res = await fetch(`${API}/todos`, { headers: getHeaders() });
            if (res.status === 401) {
                logout();
                return;
            }
            const todos = await res.json();
            const list = document.getElementById("todoList");
            list.innerHTML = "";

            const remaining = todos.filter(t => !t.completed).length;
            document.getElementById("counter").textContent =
                remaining === 1 ? "1 item left" : `${remaining} items left`;

            todos.forEach(todo => {
                const li = document.createElement("li");
                if (todo.completed) li.classList.add("completed");
                li.innerHTML = `
                    <input type="checkbox" ${todo.completed ? "checked" : ""}
                           onchange="toggleTodo(${todo.id}, this.checked)">
                    <span>${todo.text}</span>
                    <button class="delete-btn" onclick="deleteTodo(${todo.id})">✕</button>
                `;
                list.appendChild(li);
            });
        }

        async function addTodo() {
            const input = document.getElementById("todoInput");
            const text = input.value.trim();
            if (!text) return;

            await fetch(`${API}/todos`, {
                method: "POST",
                headers: getHeaders(),
                body: JSON.stringify({ text })
            });
            input.value = "";
            loadTodos();
        }

        async function toggleTodo(id, completed) {
            await fetch(`${API}/todos/${id}?completed=${completed}`, {
                method: "PUT",
                headers: getHeaders()
            });
            loadTodos();
        }

        async function deleteTodo(id) {
            await fetch(`${API}/todos/${id}`, {
                method: "DELETE",
                headers: getHeaders()
            });
            loadTodos();
        }

        async function clearCompleted() {
            const res = await fetch(`${API}/todos`, { headers: getHeaders() });
            const todos = await res.json();
            for (const todo of todos) {
                if (todo.completed) {
                    await fetch(`${API}/todos/${todo.id}`, {
                        method: "DELETE",
                        headers: getHeaders()
                    });
                }
            }
            loadTodos();
        }

        if (token) {
            showTodoApp();
        }

        document.getElementById("password").addEventListener("keypress", e => {
            if (e.key === "Enter") handleAuth();
        });
        document.getElementById("todoInput").addEventListener("keypress", e => {
            if (e.key === "Enter") addTodo();
        });
    </script>
</body>
</html>
