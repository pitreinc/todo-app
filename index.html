<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>William's Todo</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: rgba(22, 27, 40, 0.88);
            --card-border: rgba(255, 255, 255, 0.07);
            --text: #e8eef7;
            --text-secondary: #8b9bb4;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --danger: #f43f5e;
            --overdue: #fb7185;
            --radius: 14px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 15% 15%, rgba(59, 130, 246, 0.09) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 85%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 32px 16px 60px;
            line-height: 1.5;
        }
        .container { max-width: 460px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #e8eef7 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--card);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: 11px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 14px var(--primary-glow);
        }
        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 26px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }
        .card h2 {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 22px;
            text-align: center;
        }
        input[type="email"],
        input[type="password"],
        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 13px 15px;
            font-size: 15px;
            border: 1px solid var(--card-border);
            border-radius: 11px;
            background: rgba(0, 0, 0, 0.28);
            color: var(--text);
            margin-bottom: 11px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        input::placeholder { color: var(--text-secondary); }
        .btn {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px var(--primary-glow);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text);
            margin-top: 10px;
        }
        .switch-auth {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .switch-auth a {
            color: var(--primary);
            cursor: pointer;
            font-weight: 500;
            margin-left: 4px;
        }
        .error {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.25);
            color: #fb7185;
            padding: 11px 13px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 13px;
            display: none;
        }
        .success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #34d399;
            padding: 11px 13px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 13px;
            display: none;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .input-row input[type="text"] {
            flex: 1;
            min-width: 140px;
            margin-bottom: 0;
        }
        .input-row input[type="date"] {
            width: auto;
            margin-bottom: 0;
        }
        .add-btn {
            padding: 0 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 11px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--primary-glow);
            transition: transform 0.15s;
        }
        .add-btn:hover { transform: translateY(-1px); }
        .filters {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        #counter { color: var(--text-secondary); font-size: 13px; }
        .clear-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }
        ul { list-style: none; }
        li {
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid var(--card-border);
            padding: 13px 14px;
            margin-bottom: 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 11px;
            transition: all 0.2s;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        li:hover { border-color: rgba(59, 130, 246, 0.3); }
        li.completed span.todo-text { text-decoration: line-through; color: var(--text-secondary); }
        li.overdue { border-color: rgba(244, 63, 94, 0.4); background: rgba(244, 63, 94, 0.06); }
        li.overdue .due-date { color: var(--overdue); font-weight: 500; }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }
        .todo-content { flex: 1; min-width: 0; }
        .todo-text {
            font-size: 15px;
            word-break: break-word;
            cursor: pointer;
            display: block;
        }
        .todo-text:hover { color: var(--primary); }
        .due-date {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            display: block;
        }
        .edit-input {
            width: 100%;
            padding: 6px 10px;
            font-size: 15px;
            border: 1px solid var(--primary);
            border-radius: 8px;
            background: rgba(0,0,0,0.4);
            color: var(--text);
            outline: none;
        }
        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            flex-shrink: 0;
            opacity: 0.6;
            transition: all 0.15s;
        }
        .delete-btn:hover { color: var(--danger); opacity: 1; }
        .hidden { display: none !important; }
        .profile-email {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 18px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>William's Todo</h1>
            <div class="header-actions">
                <button class="icon-btn" id="profileBtn" onclick="showProfile()" title="Profile" style="display:none">👤</button>
                <button class="icon-btn" id="logoutBtn" onclick="logout()" title="Logout" style="display:none">⏻</button>
            </div>
        </header>

        <!-- AUTH -->
        <div id="authSection" class="card">
            <h2 id="authTitle">Welcome back</h2>
            <div class="error" id="authError"></div>
            <input type="email" id="email" placeholder="Email address" autocomplete="email">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <button class="btn btn-primary" id="authBtn" onclick="handleAuth()">Sign in</button>
            <div class="switch-auth">
                <span id="switchText">New here?</span>
                <a id="switchLink" onclick="toggleAuthMode()">Create an account</a>
            </div>
        </div>

        <!-- TODOS -->
        <div id="todoSection" class="hidden">
            <div class="input-row">
                <input type="text" id="todoInput" placeholder="Add a new task...">
                <input type="date" id="dueDateInput">
                <button class="add-btn" onclick="addTodo()">Add</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
                <button class="filter-btn" data-filter="active" onclick="setFilter('active')">Active</button>
                <button class="filter-btn" data-filter="completed" onclick="setFilter('completed')">Completed</button>
                <button class="filter-btn" data-filter="overdue" onclick="setFilter('overdue')">Overdue</button>
            </div>

            <div class="toolbar">
                <p id="counter">0 items left</p>
                <button class="clear-btn" onclick="clearCompleted()">Clear completed</button>
            </div>
            <ul id="todoList"></ul>
        </div>

        <!-- PROFILE -->
        <div id="profileSection" class="card hidden">
            <h2>Profile</h2>
            <div class="error" id="profileError"></div>
            <div class="success" id="profileSuccess"></div>
            <p class="profile-email" id="profileEmail">Loading...</p>
            <input type="password" id="currentPassword" placeholder="Current password">
            <input type="password" id="newPassword" placeholder="New password">
            <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
            <button class="btn btn-secondary" onclick="showTodoApp()">← Back to Todos</button>
        </div>
    </div>

    <script>
        const API = "https://william-todo.onrender.com";
        let token = localStorage.getItem("token");
        let isLoginMode = true;
        let allTodos = [];
        let currentFilter = "all";

        function showError(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = "block";
        }
        function clearMessages() {
            ["authError", "profileError", "profileSuccess"].forEach(id => {
                document.getElementById(id).style.display = "none";
            });
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById("authTitle").textContent = isLoginMode ? "Welcome back" : "Create account";
            document.getElementById("authBtn").textContent = isLoginMode ? "Sign in" : "Create account";
            document.getElementById("switchText").textContent = isLoginMode ? "New here?" : "Already have an account?";
            document.getElementById("switchLink").textContent = isLoginMode ? "Create an account" : "Sign in";
            clearMessages();
        }

        async function handleAuth() {
            clearMessages();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            if (!email || !password) {
                showError("authError", "Please fill in both fields");
                return;
            }
            try {
                const res = await fetch(`${API}${isLoginMode ? "/login" : "/register"}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    showError("authError", data.detail || "Something went wrong");
                    return;
                }
                token = data.access_token;
                localStorage.setItem("token", token);
                showTodoApp();
            } catch {
                showError("authError", "Network error. Please try again.");
            }
        }

        function showTodoApp() {
            document.getElementById("authSection").classList.add("hidden");
            document.getElementById("profileSection").classList.add("hidden");
            document.getElementById("todoSection").classList.remove("hidden");
            document.getElementById("logoutBtn").style.display = "flex";
            document.getElementById("profileBtn").style.display = "flex";
            loadTodos();
        }

        function showProfile() {
            document.getElementById("todoSection").classList.add("hidden");
            document.getElementById("profileSection").classList.remove("hidden");
            clearMessages();
            loadProfile();
        }

        async function loadProfile() {
            const res = await fetch(`${API}/me`, { headers: getHeaders() });
            if (res.status === 401) { logout(); return; }
            const data = await res.json();
            document.getElementById("profileEmail").textContent = data.email;
        }

        async function changePassword() {
            clearMessages();
            const current = document.getElementById("currentPassword").value;
            const next = document.getElementById("newPassword").value;
            if (!current || !next) {
                showError("profileError", "Please fill in both password fields");
                return;
            }
            if (next.length < 6) {
                showError("profileError", "New password must be at least 6 characters");
                return;
            }
            try {
                const res = await fetch(`${API}/change-password`, {
                    method: "POST",
                    headers: getHeaders(),
                    body: JSON.stringify({ current_password: current, new_password: next })
                });
                const data = await res.json();
                if (!res.ok) {
                    showError("profileError", data.detail || "Failed to update password");
                    return;
                }
                document.getElementById("profileSuccess").textContent = "Password updated successfully";
                document.getElementById("profileSuccess").style.display = "block";
                document.getElementById("currentPassword").value = "";
                document.getElementById("newPassword").value = "";
            } catch {
                showError("profileError", "Network error");
            }
        }

        function logout() {
            token = null;
            localStorage.removeItem("token");
            document.getElementById("authSection").classList.remove("hidden");
            document.getElementById("todoSection").classList.add("hidden");
            document.getElementById("profileSection").classList.add("hidden");
            document.getElementById("logoutBtn").style.display = "none";
            document.getElementById("profileBtn").style.display = "none";
            document.getElementById("email").value = "";
            document.getElementById("password").value = "";
        }

        function getHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            };
        }

        function isOverdue(todo) {
            if (!todo.due_date || todo.completed) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return new Date(todo.due_date + "T00:00:00") < today;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll(".filter-btn").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.filter === filter);
            });
            renderTodos();
        }

        function renderTodos() {
            let filtered = allTodos;
            if (currentFilter === "active") filtered = allTodos.filter(t => !t.completed);
            else if (currentFilter === "completed") filtered = allTodos.filter(t => t.completed);
            else if (currentFilter === "overdue") filtered = allTodos.filter(t => isOverdue(t));

            const list = document.getElementById("todoList");
            list.innerHTML = "";

            const remaining = allTodos.filter(t => !t.completed).length;
            document.getElementById("counter").textContent =
                remaining === 1 ? "1 item left" : `${remaining} items left`;

            filtered.forEach(todo => {
                const li = document.createElement("li");
                if (todo.completed) li.classList.add("completed");
                if (isOverdue(todo)) li.classList.add("overdue");

                const dueHtml = todo.due_date
                    ? `<span class="due-date">📅 ${todo.due_date}${isOverdue(todo) ? " · Overdue" : ""}</span>`
                    : "";

                li.innerHTML = `
                    <input type="checkbox" ${todo.completed ? "checked" : ""}
                           onchange="toggleTodo(${todo.id}, this.checked)">
                    <div class="todo-content">
                        <span class="todo-text" onclick="startEdit(${todo.id}, this)">${todo.text}</span>
                        ${dueHtml}
                    </div>
                    <button class="delete-btn" onclick="deleteTodo(${todo.id})">✕</button>
                `;
                list.appendChild(li);
            });
        }

        async function loadTodos() {
            const res = await fetch(`${API}/todos`, { headers: getHeaders() });
            if (res.status === 401) { logout(); return; }
            allTodos = await res.json();
            renderTodos();
        }

        function startEdit(id, el) {
            const currentText = el.textContent;
            const input = document.createElement("input");
            input.type = "text";
            input.className = "edit-input";
            input.value = currentText;
            el.replaceWith(input);
            input.focus();
            input.select();

            const save = async () => {
                const newText = input.value.trim();
                if (newText && newText !== currentText) {
                    await fetch(`${API}/todos/${id}?text=${encodeURIComponent(newText)}`, {
                        method: "PUT",
                        headers: getHeaders()
                    });
                    loadTodos();
                } else {
                    loadTodos();
                }
            };

            input.addEventListener("blur", save);
            input.addEventListener("keydown", e => {
                if (e.key === "Enter") input.blur();
                if (e.key === "Escape") loadTodos();
            });
        }

        async function addTodo() {
            const input = document.getElementById("todoInput");
            const dateInput = document.getElementById("dueDateInput");
            const text = input.value.trim();
            if (!text) return;
            const body = { text };
            if (dateInput.value) body.due_date = dateInput.value;
            await fetch(`${API}/todos`, {
                method: "POST",
                headers: getHeaders(),
                body: JSON.stringify(body)
            });
            input.value = "";
            dateInput.value = "";
            loadTodos();
        }

        async function toggleTodo(id, completed) {
            await fetch(`${API}/todos/${id}?completed=${completed}`, {
                method: "PUT",
                headers: getHeaders()
            });
            loadTodos();
        }

        async function deleteTodo(id) {
            await fetch(`${API}/todos/${id}`, {
                method: "DELETE",
                headers: getHeaders()
            });
            loadTodos();
        }

        async function clearCompleted() {
            const completed = allTodos.filter(t => t.completed);
            for (const todo of completed) {
                await fetch(`${API}/todos/${todo.id}`, {
                    method: "DELETE",
                    headers: getHeaders()
                });
            }
            loadTodos();
        }

        if (token) showTodoApp();

        document.getElementById("password").addEventListener("keypress", e => {
            if (e.key === "Enter") handleAuth();
        });
        document.getElementById("todoInput").addEventListener("keypress", e => {
            if (e.key === "Enter") addTodo();
        });
    </script>
</body>
</html>
